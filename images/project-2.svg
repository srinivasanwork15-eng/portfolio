<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p2-bg)" rx="16"/>
  <!-- App Window -->
  <rect x="40" y="30" width="520" height="300" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
  <circle cx="65" cy="52" r="6" fill="#ef4444"/>
  <circle cx="85" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="105" cy="52" r="6" fill="#10b981"/>
  <!-- Search bar -->
  <rect x="150" y="42" width="300" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="170" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">🔍 Search city (e.g. San Francisco, Tokyo...)</text>

  <!-- Big Weather Card -->
  <rect x="65" y="86" width="280" height="225" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="130" cy="155" r="38" fill="url(#sun-grad)"/>
  <!-- Cloud overlapping sun -->
  <path d="M125 175 C125 160 140 148 155 152 C162 142 178 140 188 150 C198 148 208 158 205 172 C215 173 218 185 210 192 L135 192 C125 192 120 185 125 175 Z" fill="#e0f2fe" opacity="0.95"/>
  
  <text x="235" y="160" fill="#f8fafc" font-family="sans-serif" font-size="44" font-weight="bold">24°C</text>
  <text x="235" y="185" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600">Partly Cloudy</text>
  <text x="75" y="115" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">San Francisco, CA</text>
  <text x="75" y="132" fill="#94a3b8" font-family="sans-serif" font-size="11">Humidity: 65% • Wind: 14 km/h</text>
  
  <line x1="80" y1="230" x2="330" y2="230" stroke="#334155" stroke-width="1"/>
  <text x="80" y="255" fill="#94a3b8" font-family="sans-serif" font-size="11">5-Day Outlook</text>
  <rect x="80" y="270" width="42" height="30" rx="6" fill="#0f172a"/>
  <rect x="130" y="270" width="42" height="30" rx="6" fill="#0f172a"/>
  <rect x="180" y="270" width="42" height="30" rx="6" fill="#0f172a"/>
  <rect x="230" y="270" width="42" height="30" rx="6" fill="#0f172a"/>
  <rect x="280" y="270" width="42" height="30" rx="6" fill="#0f172a"/>

  <!-- Right side chart/details -->
  <rect x="360" y="86" width="180" height="105" rx="12" fill="#1e293b"/>
  <text x="375" y="112" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Hourly Temperature</text>
  <path d="M375 165 Q400 135 425 150 T470 130 T515 155" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="425" cy="150" r="4" fill="#38bdf8"/>
  <circle cx="470" cy="130" r="4" fill="#38bdf8"/>

  <rect x="360" y="206" width="180" height="105" rx="12" fill="#1e293b"/>
  <text x="375" y="232" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Air Quality & UV Index</text>
  <rect x="375" y="250" width="150" height="12" rx="6" fill="#334155"/>
  <rect x="375" y="250" width="105" height="12" rx="6" fill="#10b981"/>
  <text x="375" y="285" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">Good (Index: 32)</text>
</svg>

